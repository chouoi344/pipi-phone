name: Verify v0.14.3 to v0.14.4 through the web updater
on:
  push:
    branches: ['ci/voice-upgrade-*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Retrieve the published v0.14.3 image by its official digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v0.14.3 --repo "$GITHUB_REPOSITORY" --pattern update.json --output "$RUNNER_TEMP/official.json"
          OLD=$(jq -er '.image | select(test("^ghcr[.]io/chouoi344/pipi-phone@sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/official.json")
          docker pull "$OLD"
          test "$(docker run --rm --network none --entrypoint node "$OLD" -p "require('./package.json').version")" = 0.14.3
          echo "GATE_OLD_IMAGE=$OLD" >> "$GITHUB_ENV"
      - name: Build the candidate and stage it only in the runner's loopback registry
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = 0.14.4
          docker run -d --name gate-ephemeral-registry -p 127.0.0.1:5017:5000 registry:2
          curl --retry 10 --retry-connrefused --fail -sS http://127.0.0.1:5017/v2/
          TAG=127.0.0.1:5017/isolated/pipi-phone:candidate
          docker build --tag "$TAG" .
          docker push "$TAG"
          REF=$(docker image inspect "$TAG" --format '{{index .RepoDigests 0}}')
          test "${REF%@*}" = 127.0.0.1:5017/isolated/pipi-phone
          docker image rm "$TAG"
          echo "GATE_NEXT_IMAGE=$REF" >> "$GITHUB_ENV"
      - name: Install pinned headless browser driver
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/gate-driver" --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          echo "PIPI_PLAYWRIGHT_MODULE=$RUNNER_TEMP/gate-driver/node_modules/playwright-core" >> "$GITHUB_ENV"
          echo "PIPI_BROWSER_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Click update in the old site, replace its container, and verify the retained session and content
        # The shipping worker runs as root to read UID 1000 owned, mode 0600 request.json.
        run: |
          sudo env GATE_OLD_IMAGE="$GATE_OLD_IMAGE" GATE_NEXT_IMAGE="$GATE_NEXT_IMAGE" \\
            PIPI_PLAYWRIGHT_MODULE="$PIPI_PLAYWRIGHT_MODULE" PIPI_BROWSER_EXECUTABLE="$PIPI_BROWSER_EXECUTABLE" \\
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \\
            "$(command -v node)" .ci-gate/upgrade.cjs


services:
  pipi-phone:
    build: .
    restart: unless-stopped
    ports:
      - "${PIPI_HOST_BIND:-127.0.0.1}:${PIPI_PORT:-18766}:8000"
    volumes:
      - pipi-data:/app/data
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DATA_DIR: /app/data
      NODE_ENV: production
      REQUIRE_SETUP_TOKEN: "${REQUIRE_SETUP_TOKEN:-0}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-}"
      SOURCE_URL: "${SOURCE_URL:-}"
      PIPI_SOURCE_URL: "${PIPI_SOURCE_URL:-}"
      PIPI_VOICE_SOURCE_URL: "${PIPI_VOICE_SOURCE_URL:-}"
      PIPI_IMAGE_SOURCE_URL: "${PIPI_IMAGE_SOURCE_URL:-}"
      PIPI_AUXILIARY_SOURCE_URL: "${PIPI_AUXILIARY_SOURCE_URL:-}"
      PIPI_CHAT_MODEL: "${PIPI_CHAT_MODEL:-}"
      PIPI_TTS_MODEL: "${PIPI_TTS_MODEL:-}"
      PIPI_STT_MODEL: "${PIPI_STT_MODEL:-}"
      PIPI_VOICE_UNDERSTANDING_MODEL: "${PIPI_VOICE_UNDERSTANDING_MODEL:-}"
      PIPI_IMAGE_MODEL: "${PIPI_IMAGE_MODEL:-}"
      PIPI_DECISION_MODEL: "${PIPI_DECISION_MODEL:-}"
      PIPI_EMBEDDING_MODEL: "${PIPI_EMBEDDING_MODEL:-}"
      PIPI_RERANK_MODEL: "${PIPI_RERANK_MODEL:-}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  pipi-data:

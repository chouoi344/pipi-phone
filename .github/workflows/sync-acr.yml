name: Sync a stable release to Alibaba Cloud

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Public stable tag to sync, or an existing GHCR tag to prewarm'
        required: true
        type: string
      build_digest:
        description: 'Optional: prewarm only. Must match the current immutable digest of the GHCR version tag'
        required: false
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      build_digest:
        description: 'Before release: copy this build digest without advertising it yet'
        required: false
        default: ''
        type: string
    secrets:
      ACR_USERNAME:
        required: true
      ACR_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'chouoi344/pipi-phone' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      BUILD_DIGEST: ${{ inputs.build_digest }}
      GH_TOKEN: ${{ github.token }}
    concurrency:
      # Manual prewarming writes only the verified image, never a channel tag.
      # It may repair missing layers while an earlier publication is retrying.
      group: ${{ (github.event_name == 'workflow_dispatch' && github.workflow == 'Sync a stable release to Alibaba Cloud' && inputs.build_digest != '' && format('pipi-acr-prewarm-{0}', inputs.release_tag)) || 'pipi-acr-publisher' }}
      queue: max
    steps:
      # Use the workflow revision, not the historical tag being backfilled.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install multi-architecture registry client
        run: |
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y skopeo
          fi
      - name: Stage missing GHCR platform images to local OCI storage
        run: python3 -B scripts/sync-acr.py stage
      - name: Upload staged OCI images to Hangzhou and verify by independent anonymous download
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: python3 -B scripts/sync-acr.py publish

name: Publish stable release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing stable tag to publish, for example v0.12.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  DOCKER_BUILD_SUMMARY: 'false'
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  webview:
    uses: ./.github/workflows/webview.yml
    with:
      source_ref: refs/tags/${{ inputs.release_tag || github.ref_name }}

  test:
    name: Check version, source and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - name: Require a stable tag and the main dispatch workflow
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' && "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo '::error::Manual releases must run the workflow from main.'
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Choose an existing stable tag such as v0.12.1.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Require a matching stable version and public repository
        id: version
        env:
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const tag = process.env.RELEASE_TAG;
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          if (!/^v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)$/.test(tag)) {
            throw new Error('Release tags must be stable versions such as v0.12.1.');
          }
          if (tag !== `v${version}`) {
            throw new Error(`Tag ${tag} does not match package.json version ${version}.`);
          }
          if (process.env.REPOSITORY_VISIBILITY !== 'public') {
            throw new Error('The stable update channel requires a public GitHub repository.');
          }
          const image = `ghcr.io/${process.env.GITHUB_REPOSITORY.toLowerCase()}`;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nimage=${image}\n`);
          NODE
      - name: Reject tracked private data and generated artifacts
        run: |
          node <<'NODE'
          const {execFileSync} = require('node:child_process');
          const files = execFileSync('git', ['ls-files', '-z'], {encoding: 'utf8'}).split('\0').filter(Boolean);
          const forbidden = /^(?:data|runtime|node_modules|\.codex|\.docker|artifacts|test-results|coverage)(?:\/|$)|(?:^|\/)\.env(?:\.|$)|\.(?:sqlite(?:3)?(?:-(?:shm|wal))?|log|zip|bak|backup)$/i;
          const trackedLocalFiles = execFileSync('git', ['ls-files', '-ci', '--exclude-per-directory=.gitignore', '-z'], {encoding: 'utf8'}).split('\0').filter(Boolean);
          const leaked = [...new Set([...files.filter(file => forbidden.test(file)), ...trackedLocalFiles])];
          if (leaked.length) throw new Error(`Remove private data or generated artifacts from the release commit:\n${leaked.join('\n')}`);
          NODE
      - name: Check the public IP HTTPS installer
        run: python3 -B -m unittest discover -s tests -p test_install_https.py
      # This job receives no provider keys, registry credentials or publishing permissions.
      # Keep the CI-only network guard in the workflow so an existing immutable tag
      # is tested unchanged when the runner settings on main are repaired.
      - name: Prepare isolated fixture networking
        run: |
          cat > "$RUNNER_TEMP/pipi-loopback.cjs" <<'GUARD'
          'use strict';
          const net = require('node:net');
          const {appendFileSync} = require('node:fs');
          const connect = net.Socket.prototype.connect;
          net.Socket.prototype.connect = function (...args) {
            let options = args[0];
            if (Array.isArray(options)) options = options[0];
            if (typeof options === 'number') options = {port:options, host:typeof args[1] === 'string' ? args[1] : 'localhost'};
            if (options && typeof options === 'object' && options.port != null) {
              const host = String(options.host || options.hostname || 'localhost').toLowerCase().replace(/^\[|\]$/g,'');
              if (!['127.0.0.1','localhost','::1','::ffff:127.0.0.1'].includes(host)) {
                appendFileSync(process.env.PHONE_AUDIT_BLOCK_LOG, 'blocked '+host+':'+Number(options.port)+'\n');
                throw new Error('isolated test only permits local fixture servers');
              }
            }
            return connect.apply(this,args);
          };
          GUARD
          node --check "$RUNNER_TEMP/pipi-loopback.cjs"
      - name: Run the application test suite
        run: |
          set -euo pipefail
          export PHONE_AUDIT_BLOCK_LOG="$RUNNER_TEMP/pipi-blocked-sockets.log"
          node --require "$RUNNER_TEMP/pipi-loopback.cjs" --test --test-concurrency=2 --test-timeout=120000 tests/*.test.cjs &
          suite_pid=$!
          (
            while kill -0 "$suite_pid" 2>/dev/null; do
              echo "::group::Runner resources $(date -u +%FT%TZ)"
              free -m
              ps -eo pid,ppid,rss,etimes,comm --sort=-rss | sed -n '1,12p'
              echo '::endgroup::'
              sleep 30
            done
          ) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          wait "$suite_pid"
      - name: Run the additional life module tests
        run: |
          export PHONE_AUDIT_BLOCK_LOG="$RUNNER_TEMP/pipi-blocked-sockets.log"
          node --require "$RUNNER_TEMP/pipi-loopback.cjs" --test --test-concurrency=2 --test-timeout=120000 test/*.test.cjs

  compose-smoke:
    name: Exercise real Compose upgrade and rollback
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Verify real image replacement, retained data and failure recovery
        run: node tests/compose-updater-docker.cjs
      - name: Verify the public Ubuntu installer enables updates on a fresh server
        run: |
          # Hosted runners share /opt with the runner account. Match the root-owned
          # deployment directory of a stock Ubuntu server on this disposable VM.
          stat -c '%U %G %a %n' /opt
          sudo install -d -o root -g root -m 0755 /opt
          sudo bash tests/install-https-smoke.sh

  image:
    name: Build the two server architectures
    needs: [test, compose-smoke, webview]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ needs.test.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: source
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the versioned image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.test.outputs.image }}:${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.commit }}
            org.opencontainers.image.version=${{ needs.test.outputs.version }}
          provenance: mode=min
      - name: Require a public image with both architectures
        env:
          IMAGE: ${{ needs.test.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo '::error::The build did not return an immutable SHA-256 image digest.'
            exit 1
          fi
          repository="${IMAGE#ghcr.io/}"
          if ! pull_token=$(curl --fail --silent --show-error --retry 3 --get \
            --data-urlencode "scope=repository:${repository}:pull" \
            --data-urlencode 'service=ghcr.io' https://ghcr.io/token | jq --exit-status --raw-output '.token'); then
            echo '::error::Anonymous GHCR access failed. Set this container package visibility to Public in GitHub package settings, then rerun the failed jobs.'
            exit 1
          fi
          echo "::add-mask::$pull_token"
          if ! curl --fail --silent --show-error --retry 3 \
            --header "Authorization: Bearer $pull_token" \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/${repository}/manifests/${DIGEST}" \
            --output "$RUNNER_TEMP/public-image.json"; then
            echo '::error::The published image cannot be pulled anonymously. Make the GHCR package Public before publishing the release.'
            exit 1
          fi
          jq --exit-status '
            any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64") and
            any(.manifests[]; .platform.os == "linux" and .platform.architecture == "arm64")
          ' "$RUNNER_TEMP/public-image.json"

  release:
    name: Publish the update manifest and release notes
    needs: [test, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.test.outputs.version }}
      IMAGE: ${{ needs.image.outputs.image }}
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      # No checkout or repository script runs with the release-writing token.
      - name: Create the manifest and publish the prepared draft
        run: |
          set -euo pipefail
          jq --null-input --arg version "$VERSION" --arg image "$IMAGE@$DIGEST" \
            '{version: $version, image: $image}' > update.json
          sha256sum update.json > update.json.sha256
          gh release create "$RELEASE_TAG" update.json update.json.sha256 \
            --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false --latest

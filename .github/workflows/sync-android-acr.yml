name: Sync official Android APK to Alibaba Cloud

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published release with its signed APK, e.g. android-v0.1.15'
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets:
      ACR_USERNAME:
        required: true
      ACR_PASSWORD:
        required: true

permissions:
  contents: read

concurrency:
  group: domestic-android-publisher
  queue: max

jobs:
  sync:
    if: >-
      github.repository == 'chouoi344/pipi-phone' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') &&
      (github.event_name != 'release' || (!github.event.release.prerelease &&
      (startsWith(github.event.release.tag_name, 'android-v') || startsWith(github.event.release.tag_name, 'v'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Check version selection and immutable APK records
        run: python3 -B -m unittest discover -s tests -p test_android_acr_release.py
      - name: Prepare the same registry client used for the server images
        run: |
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y skopeo
          fi
      - name: Verify the signed GitHub release bytes, mirror and announce
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: python3 -B scripts/sync-android-acr.py
